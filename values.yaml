# Local defaults. Production overrides are in values-production.yaml.
production: false
replicaCount: 1
image:
  repository: http-echo-local
  tag: hardened
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
containerPort: 8080
service:
  type: ClusterIP
  port: 5678
ingress:
  enabled: true
  className: nginx-oss
  annotations:
    nginx.org/ssl-redirect: "true"
  hosts:
    - host: http-echo.k8s-server.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: http-echo-tls
      hosts: [http-echo.k8s-server.local]
# Initial budgets; validate against workload measurements before production.
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
testResources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 100m, memory: 128Mi}
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
networkPolicy:
  enabled: true
  ingressNamespace: nginx-ingress
  ingressPodLabels:
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/instance: nginx-ingress
podDisruptionBudget:
  enabled: false
  minAvailable: 1
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
